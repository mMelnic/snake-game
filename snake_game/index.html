<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="scoreDisplay">Score: 0</div>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        <div id="legend">
            <h2>Power-ups:</h2>
            <div class="legend-item">
                <span class="power food"></span>
                <div class="legend-title">Food Respawn</div>
                <div class="legend-description">Instantly spawns a new food.</div>
            </div>
            <div class="legend-item">
                <span class="power slow"></span>
                <div class="legend-title">Slow Down</div>
                <div class="legend-description">Temporarily slows the snake speed.</div>
            </div>
            <div class="legend-item">
                <span class="power doublePoints"></span>
                <div class="legend-title">Double Points</div>
                <div class="legend-description">Gives extra points on the next food.</div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
